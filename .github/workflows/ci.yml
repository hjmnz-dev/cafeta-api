# Revisión en cada push y PR: lint, formato, tipos, build, pruebas unitarias y e2e.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cafeta
          POSTGRES_PASSWORD: cafeta
          POSTGRES_DB: cafeta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafeta -d cafeta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # La CLI de Prisma no lee .env.test; las e2e sí (NODE_ENV=test).
      DATABASE_URL: postgresql://cafeta:cafeta@localhost:5432/cafeta_test
      DIRECT_URL: postgresql://cafeta:cafeta@localhost:5432/cafeta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:e2e
