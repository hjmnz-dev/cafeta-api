# PostgreSQL local: base `cafeta` (desarrollo) y `cafeta_test` (pruebas e2e),
# y Azurite, el emulador de Azure Blob para los archivos (spec 0008, decisión 13).
# Arranca con: npm run db:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cafeta
      POSTGRES_PASSWORD: cafeta
      POSTGRES_DB: cafeta
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cafeta -d cafeta']
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - '10000:10000'
    volumes:
      - azuritedata:/data

volumes:
  pgdata:
  azuritedata:
